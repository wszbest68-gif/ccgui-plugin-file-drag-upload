# 发版流水线（tag = manifest version，无 v 前缀）。
# 本插件为零构建单文件 ESM：校验 manifest → 校验 tag → 打包三件套 → 发 Release。
name: release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifest
        run: |
          node -e "const m=require('./manifest.json'); if(!m.id||!/^\\d+\\.\\d+\\.\\d+$/.test(m.version)||!Array.isArray(m.permissions)) { console.error('invalid manifest'); process.exit(1) }"

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG != manifest version $VERSION"
            exit 1
          fi

      - name: Syntax check
        run: node --check main.js

      - name: Generate checksums
        run: |
          FILES="main.js manifest.json"
          [ -f styles.css ] && FILES="$FILES styles.css"
          sha256sum $FILES > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release with plugin artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            checksums.txt
